# Frontend + API dalam satu situs Netlify: API berjalan sebagai Netlify Function (server/functions/api.js)
[build]
  command = "npm ci --prefix server && npm ci --prefix client && npm run build --prefix client"
  publish = "client/dist"
  functions = "server/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
