# Frontend + API dalam satu situs Netlify: API berjalan sebagai Netlify Function (server/functions/api.js)
# base ditulis eksplisit: situs ini dibuat dengan Base directory "client", jadi semua path relatif ke client/
[build]
  base = "client"
  command = "npm ci --prefix ../server && npm ci && npm run build"
  publish = "dist"
  functions = "../server/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
